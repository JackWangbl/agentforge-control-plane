[project]
name = "agentforge-control-plane"
version = "0.1.0"
description = "AgentScope 2.0 based enterprise agent management control plane"
requires-python = ">=3.11"
dependencies = [
  "agentscope>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.12",
  "pymysql>=1.1.0",
  "langfuse>=2.57.0,<3",
  "playwright>=1.49.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

